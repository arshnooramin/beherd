<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Alert your emergency contacts with one press or one text.">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
    <title>{% block title %}BeHerd{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23e5484d'/><circle cx='16' cy='16' r='6' fill='white'/></svg>">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
    <div class="shell">
        <header class="topbar">
            <a class="wordmark" href="{{ url_for('main.home') }}" aria-label="BeHerd home">
                <span class="wordmark-dot" aria-hidden="true"></span><span>Be<b>Herd</b></span>
            </a>
            <nav class="nav">
                {% if current_user.is_authenticated %}
                    <a class="nav-link" href="{{ url_for('main.view_preset') }}">Preset</a>
                    <form method="post" action="{{ url_for('auth.logout') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <button type="submit" class="nav-link">Sign out</button>
                    </form>
                {% elif request.endpoint != 'auth.login' %}
                    <a class="nav-link" href="{{ url_for('auth.login') }}">Sign in</a>
                {% endif %}
            </nav>
        </header>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="notice notice-{{ category }}" role="status">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
